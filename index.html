<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilom Resort | Home</title>
    <link rel="stylesheet" href="public-style.css">
</head>
<body>

    <nav>
    <div class="brand-container">
        <img src="text-1790998905612.png" alt="Hilom" class="new-text-logo">
        <span class="sub-text">by Dondeezco</span>
    </div>
    
    <!-- New Hamburger Button for Mobile -->
    <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>

    <!-- Wrapped Links -->
    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="experience.html">Experience</a>
        <a href="rooms.html">Our Rooms</a>
        <a href="booking.html">Book & Status</a>
        <a href="contact.html">Contact</a>
        <a href="booking.html" class="btn">Book Now</a>
    </div>
</nav>

    <section class="hero">
       <video class="hero-video" autoplay muted loop playsinline>
            <source src="hilom-resort.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h2>Find Your Perfect Getaway</h2>
            <p>Experience relaxation, comfort, and exceptional coastal views. Book your stay with us today.</p>
            <a href="booking.html" style="background: var(--accent); color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 18px;">Reserve a Room</a>
        </div>
    </section>

    <footer>
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; padding-top: 10px;">
            <p style="margin: 0; font-size: 14px;">&copy; <span id="year"></span> Hilom by Dondeezco. All rights reserved.</p>
            <img src="hilom.png" alt="Hilom by Dondeezco" style="height: 50px; object-fit: contain; filter: brightness(0) invert(1);">
        </div>
    </footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
        window.addEventListener("scroll", function() {
            const nav = document.querySelector("nav");
            if (window.scrollY > 50) nav.classList.add("scrolled");
            else nav.classList.remove("scrolled");
        });
    </script>

    <script>
    document.getElementById('year').innerText = new Date().getFullYear();
    
    // Transparent to Glass Navbar
    window.addEventListener("scroll", function() {
        const nav = document.querySelector("nav");
        if (window.scrollY > 50) nav.classList.add("scrolled");
        else nav.classList.remove("scrolled");
    });

    // Cinematic Scroll Reveal Animation
    function reveal() {
        var reveals = document.querySelectorAll(".reveal");
        for (var i = 0; i < reveals.length; i++) {
            var windowHeight = window.innerHeight;
            var elementTop = reveals[i].getBoundingClientRect().top;
            var elementVisible = 100; // Trigger point
            if (elementTop < windowHeight - elementVisible) {
                reveals[i].classList.add("active");
            }
        }
    }
    window.addEventListener("scroll", reveal);
    reveal(); 
    // Trigger once on load

    function toggleMenu() {
        document.getElementById("navLinks").classList.toggle("active");
    }
    

    
</script>
</body>
</html>
