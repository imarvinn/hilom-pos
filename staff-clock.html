<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilom | Staff DTR</title>
    
    <!-- BLOCK ALL OFFLINE CACHING -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- UPGRADED FIREBASE ENGINE (Matches your POS Dashboard exactly) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #557a46;
            --primary-dark: #2b4227;
            --bg-color: #f1f8e9;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .clock-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border-top: 6px solid var(--primary);
        }
        #liveTime {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-dark);
            margin: 10px 0 5px 0;
            letter-spacing: 2px;
        }
        #liveDate {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .pin-display {
            font-size: 32px;
            letter-spacing: 8px;
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 38px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .numpad button {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: 0.1s;
        }
        .numpad button:active { background: #e0e0e0; }
        .btn-clear { color: #bd4b4b !important; }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .action-buttons button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-in { background-color: var(--primary); }
        .btn-in:hover { background-color: var(--primary-dark); }
        .btn-out { background-color: #bd4b4b; }
        .btn-out:hover { background-color: #a03f3f; }
        .btn-break { background-color: #d4a373; }
        .btn-break:hover { background-color: #b08055; }
    </style>
</head>
<body>

    <div class="clock-container">
        <h2 style="margin: 0; color: #888; font-size: 18px;">HILOM STAFF PORTAL</h2>
        <div id="liveTime">00:00:00</div>
        <div id="liveDate">Loading date...</div>

        <div id="pinDisplay" class="pin-display"></div>

        <div class="numpad">
            <button onclick="pressKey('1')">1</button>
            <button onclick="pressKey('2')">2</button>
            <button onclick="pressKey('3')">3</button>
            <button onclick="pressKey('4')">4</button>
            <button onclick="pressKey('5')">5</button>
            <button onclick="pressKey('6')">6</button>
            <button onclick="pressKey('7')">7</button>
            <button onclick="pressKey('8')">8</button>
            <button onclick="pressKey('9')">9</button>
            <button onclick="clearPin()" class="btn-clear">C</button>
            <button onclick="pressKey('0')">0</button>
            <button onclick="backspace()">⌫</button>
        </div>

        <div class="action-buttons">
            <button class="btn-in" onclick="processPunch('IN')">TIME IN</button>
            <button class="btn-out" onclick="processPunch('OUT')">TIME OUT</button>
        </div>
        <div class="action-buttons">
            <button class="btn-break" onclick="processPunch('START_BREAK')">START BREAK</button>
            <button class="btn-break" style="background-color: #8c5d3a;" onclick="processPunch('END_BREAK')">END BREAK</button>
        </div>
    </div>

    <script>
        // --- ZOMBIE CACHE KILLER ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) registration.unregister();
            });
        }
        
        // Prevent Back/Forward Cache freezing
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) window.location.reload();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAfu260e9bNPHMBPcEtVzEJ2G2hcScNl5A",
            authDomain: "dbr-pos.firebaseapp.com",
            projectId: "dbr-pos",
            storageBucket: "dbr-pos.firebasestorage.app",
            messagingSenderId: "176532211278",
            appId: "1:176532211278:web:57d78462a3355a32ce251f",
            measurementId: "G-MPYZMBHZDC"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // --- LIVE CLOCK LOGIC ---
        function updateClock() {
            const now = new Date();
            document.getElementById('liveTime').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- NUMPAD LOGIC ---
        let currentPin = "";
        const pinDisplay = document.getElementById("pinDisplay");
        function pressKey(num) { if (currentPin.length < 4) { currentPin += num; updatePinDisplay(); } }
        function clearPin() { 
            currentPin = ""; 
            pinDisplay.style.color = "#333";
            pinDisplay.style.fontSize = "32px";
            pinDisplay.style.letterSpacing = "8px";
            updatePinDisplay(); 
        }
        function backspace() { currentPin = currentPin.slice(0, -1); updatePinDisplay(); }
        function updatePinDisplay() { pinDisplay.innerText = "*".repeat(currentPin.length); }

        // --- BULLETPROOF PUNCH LOGIC ---
        async function processPunch(type) {
            if (currentPin.length !== 4) return alert("Please enter your 4-digit PIN.");
            
            // Visual feedback so you know it's not frozen
            pinDisplay.innerText = "SYNCING...";
            pinDisplay.style.color = "#557a46";
            pinDisplay.style.fontSize = "16px";
            pinDisplay.style.letterSpacing = "2px";
            
            try {
                // THE DEFIBRILLATOR: Jolt the connection awake in case the browser froze it
                await db.enableNetwork();

                // 1. Verify PIN
                const staffQuery = await db.collection("staff").where("pinCode", "==", currentPin).get();
                if (staffQuery.empty) {
                    clearPin();
                    return alert("Invalid PIN. Please try again.");
                }

                const staffId = staffQuery.docs[0].id;
                const staffData = staffQuery.docs[0].data();
                
                // 2. Foolproof Local Date Builder
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const shiftDateStr = `${year}-${month}-${day}`;
                
                const batch = db.batch();

                // 3. TIME IN
                if (type === 'IN') {
                    if (staffData.status === "CLOCKED_IN" || staffData.status === "ON_BREAK") {
                        clearPin();
                        return alert(`${staffData.name}, you are already on an active shift!`);
                    }

                    batch.set(db.collection("dtr_logs").doc(), {
                        staffId: staffId,
                        staffName: staffData.name,
                        timeIn: firebase.firestore.FieldValue.serverTimestamp(),
                        timeOut: null, breakStart: null, breakEnd: null,
                        lateFromBreak: false, shiftDate: shiftDateStr, totalHours: 0
                    });

                    batch.update(db.collection("staff").doc(staffId), { status: "CLOCKED_IN" });
                    await batch.commit(); // STRICT AWAIT
                    alert(`✅ TIME IN SUCCESS\nWelcome, ${staffData.name}!`);
                    clearPin();
                    return; 
                }

                // 4. FIND OPEN LOG FOR BREAKS/OUT
                const openLogs = [];
                const allStaffLogs = await db.collection("dtr_logs").where("staffId", "==", staffId).get();
                allStaffLogs.forEach(doc => { if (doc.data().timeOut === null) openLogs.push(doc); });

                if (openLogs.length === 0) {
                    clearPin();
                    return alert("Error: Could not find your active time-in record. Have you clocked in today?");
                }

                // 5. START BREAK
                if (type === 'START_BREAK') {
                    if (staffData.status !== "CLOCKED_IN") {
                        clearPin(); return alert(`You must be actively clocked in to start a break.`);
                    }

                    batch.update(db.collection("dtr_logs").doc(openLogs[0].id), { breakStart: firebase.firestore.FieldValue.serverTimestamp() });
                    batch.update(db.collection("staff").doc(staffId), { status: "ON_BREAK" });
                    
                    await batch.commit(); 
                    alert(`☕ BREAK STARTED\nEnjoy your lunch, ${staffData.name}!\nReturn within 1 hour.`);
                    
                // 6. END BREAK
                } else if (type === 'END_BREAK') {
                    if (staffData.status !== "ON_BREAK") {
                        clearPin(); return alert(`You are not currently on a break.`);
                    }

                    let breakStartMs = now.getTime(); 
                    if (openLogs[0].data().breakStart && typeof openLogs[0].data().breakStart.toDate === 'function') {
                        breakStartMs = openLogs[0].data().breakStart.toDate().getTime();
                    }
                    
                    const breakDurationMinutes = (now.getTime() - breakStartMs) / (1000 * 60);
                    const isLate = breakDurationMinutes > 60; 
                    
                    batch.update(db.collection("dtr_logs").doc(openLogs[0].id), { 
                        breakEnd: firebase.firestore.FieldValue.serverTimestamp(),
                        lateFromBreak: isLate
                    });
                    batch.update(db.collection("staff").doc(staffId), { status: "CLOCKED_IN" });
                    
                    await batch.commit(); 
                    
                    if (isLate) alert(`⚠️ LATE RETURN\nYou exceeded the 60-minute limit (${Math.round(breakDurationMinutes)} mins).`);
                    else alert(`▶️ BREAK ENDED\nWelcome back, ${staffData.name}!`);

                // 7. TIME OUT
                } else if (type === 'OUT') {
                    if (staffData.status === "CLOCKED_OUT") {
                        clearPin(); return alert(`You are already clocked out.`);
                    }
                    if (staffData.status === "ON_BREAK") {
                        clearPin(); return alert(`Please END BREAK before Clocking Out for the day.`);
                    }

                    openLogs.forEach(openLogDoc => {
                        let timeInMs = now.getTime(); 
                        if (openLogDoc.data().timeIn && typeof openLogDoc.data().timeIn.toDate === 'function') {
                            timeInMs = openLogDoc.data().timeIn.toDate().getTime();
                        }
                        
                        let breakDeductionMs = 0;
                        if (openLogDoc.data().breakStart && openLogDoc.data().breakEnd) {
                            let bEnd = now.getTime();
                            if(typeof openLogDoc.data().breakEnd.toDate === 'function') bEnd = openLogDoc.data().breakEnd.toDate().getTime();
                            let bStart = now.getTime();
                            if(typeof openLogDoc.data().breakStart.toDate === 'function') bStart = openLogDoc.data().breakStart.toDate().getTime();
                            breakDeductionMs = bEnd - bStart;
                        }
                        
                        const netWorkedMs = (now.getTime() - timeInMs) - breakDeductionMs;
                        let hoursWorked = netWorkedMs / (1000 * 60 * 60);
                        if (isNaN(hoursWorked) || hoursWorked < 0) hoursWorked = 0; 

                        batch.update(db.collection("dtr_logs").doc(openLogDoc.id), {
                            timeOut: firebase.firestore.FieldValue.serverTimestamp(),
                            totalHours: parseFloat(hoursWorked.toFixed(2))
                        });
                    });

                    batch.update(db.collection("staff").doc(staffId), { status: "CLOCKED_OUT" });
                    
                    await batch.commit(); 
                    alert(`👋 TIME OUT SUCCESS\nGoodbye, ${staffData.name}!`);
                }

                clearPin();

            } catch (error) {
                console.error("Firebase Error:", error);
                alert("An error occurred connecting to the database. Your punch was NOT saved. Check your internet connection.");
                clearPin();
            }
        }
    </script>
</body>
</html>
