<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilom | Staff DTR</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #557a46;
            --primary-dark: #2b4227;
            --bg-color: #f1f8e9;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .clock-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border-top: 6px solid var(--primary);
        }
        #liveTime {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-dark);
            margin: 10px 0 5px 0;
            letter-spacing: 2px;
        }
        #liveDate {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .pin-display {
            font-size: 32px;
            letter-spacing: 8px;
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 38px;
            color: #333;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .numpad button {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: 0.1s;
        }
        .numpad button:active { background: #e0e0e0; }
        .btn-clear { color: #bd4b4b !important; }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .action-buttons button {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-in { background-color: var(--primary); }
        .btn-in:hover { background-color: var(--primary-dark); }
        .btn-out { background-color: #bd4b4b; }
        .btn-out:hover { background-color: #a03f3f; }
    </style>
</head>
<body>

    <div class="clock-container">
        <h2 style="margin: 0; color: #888; font-size: 18px;">HILOM STAFF PORTAL</h2>
        <div id="liveTime">00:00:00</div>
        <div id="liveDate">Loading date...</div>

        <div id="pinDisplay" class="pin-display"></div>

        <div class="numpad">
            <button onclick="pressKey('1')">1</button>
            <button onclick="pressKey('2')">2</button>
            <button onclick="pressKey('3')">3</button>
            <button onclick="pressKey('4')">4</button>
            <button onclick="pressKey('5')">5</button>
            <button onclick="pressKey('6')">6</button>
            <button onclick="pressKey('7')">7</button>
            <button onclick="pressKey('8')">8</button>
            <button onclick="pressKey('9')">9</button>
            <button onclick="clearPin()" class="btn-clear">C</button>
            <button onclick="pressKey('0')">0</button>
            <button onclick="backspace()">⌫</button>
        </div>

        <div class="action-buttons">
            <button class="btn-in" onclick="processPunch('IN')">TIME IN</button>
            <button class="btn-out" onclick="processPunch('OUT')">TIME OUT</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAfu260e9bNPHMBPcEtVzEJ2G2hcScNl5A",
            authDomain: "dbr-pos.firebaseapp.com",
            projectId: "dbr-pos",
            storageBucket: "dbr-pos.firebasestorage.app",
            messagingSenderId: "176532211278",
            appId: "1:176532211278:web:57d78462a3355a32ce251f",
            measurementId: "G-MPYZMBHZDC"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // --- LIVE CLOCK LOGIC ---
        function updateClock() {
            const now = new Date();
            document.getElementById('liveTime').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- NUMPAD LOGIC ---
        let currentPin = "";
        const pinDisplay = document.getElementById("pinDisplay");

        function pressKey(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                updatePinDisplay();
            }
        }
        function clearPin() { currentPin = ""; updatePinDisplay(); }
        function backspace() { currentPin = currentPin.slice(0, -1); updatePinDisplay(); }
        function updatePinDisplay() { pinDisplay.innerText = "*".repeat(currentPin.length); }

        // --- CLOCK IN & OUT LOGIC ---
        async function processPunch(type) {
            if (currentPin.length !== 4) return alert("Please enter your 4-digit PIN.");
            
            try {
                // Find Staff Member by PIN
                const staffQuery = await db.collection("staff").where("pinCode", "==", currentPin).get();
                if (staffQuery.empty) {
                    clearPin();
                    return alert("Invalid PIN. Please try again.");
                }

                const staffDoc = staffQuery.docs[0];
                const staffId = staffDoc.id;
                const staffData = staffDoc.data();
                
                const now = new Date();
                const shiftDateStr = now.toISOString().split('T')[0]; 
                const batch = db.batch();

                if (type === 'IN') {
                    if (staffData.status === "CLOCKED_IN") {
                        clearPin();
                        return alert(`${staffData.name}, you are already clocked in!`);
                    }

                    // Create new DTR Log
                    const dtrRef = db.collection("dtr_logs").doc();
                    batch.set(dtrRef, {
                        staffId: staffId,
                        staffName: staffData.name,
                        timeIn: firebase.firestore.FieldValue.serverTimestamp(),
                        timeOut: null,
                        shiftDate: shiftDateStr,
                        totalHours: 0
                    });

                    // Update staff status
                    batch.update(db.collection("staff").doc(staffId), { status: "CLOCKED_IN" });

                    await batch.commit();
                    alert(`✅ TIME IN SUCCESS\nWelcome, ${staffData.name}!\nTime: ${now.toLocaleTimeString()}`);
                
                } else if (type === 'OUT') {
                    if (staffData.status !== "CLOCKED_IN") {
                        clearPin();
                        return alert(`${staffData.name}, you must Time In first.`);
                    }

                    // Find the open DTR Log
                    const logQuery = await db.collection("dtr_logs")
                        .where("staffId", "==", staffId)
                        .where("timeOut", "==", null)
                        .limit(1).get();

                    if (!logQuery.empty) {
                        const logDoc = logQuery.docs[0];
                        
                        // Calculate hours
                        const timeInMs = logDoc.data().timeIn.toDate().getTime();
                        const timeOutMs = now.getTime();
                        const hoursWorked = (timeOutMs - timeInMs) / (1000 * 60 * 60);

                        batch.update(db.collection("dtr_logs").doc(logDoc.id), {
                            timeOut: firebase.firestore.FieldValue.serverTimestamp(),
                            totalHours: parseFloat(hoursWorked.toFixed(2))
                        });
                    }

                    // Update staff status
                    batch.update(db.collection("staff").doc(staffId), { status: "CLOCKED_OUT" });

                    await batch.commit();
                    alert(`👋 TIME OUT SUCCESS\nGoodbye, ${staffData.name}!\nTime: ${now.toLocaleTimeString()}`);
                }

                clearPin();

            } catch (error) {
                console.error(error);
                alert("An error occurred connecting to the database.");
            }
        }
    </script>
</body>
</html>
