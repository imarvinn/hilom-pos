    <section class="gallery" style="flex: 1;">

            <img src="708910845_122173818824854145_7561146922554022170_n.jpg" alt="Beach Pathway">

    <script>
    document.getElementById('year').innerText = new Date().getFullYear();
    
    // Transparent to Glass Navbar
    window.addEventListener("scroll", function() {
        const nav = document.querySelector("nav");
        if (window.scrollY > 50) nav.classList.add("scrolled");
        else nav.classList.remove("scrolled");
    });

    // Cinematic Scroll Reveal Animation
    function reveal() {
        var reveals = document.querySelectorAll(".reveal");
        for (var i = 0; i < reveals.length; i++) {
            var windowHeight = window.innerHeight;
            var elementTop = reveals[i].getBoundingClientRect().top;
            var elementVisible = 100;
            if (elementTop < windowHeight - elementVisible) {
                reveals[i].classList.add("active");
            }
        }
    }
    window.addEventListener("scroll", reveal);
    reveal(); 

    // Toggle Mobile Hamburger Menu
    function toggleMenu() {
        document.getElementById("navLinks").classList.toggle("active");
    }

    // Highlight Active Menu Item Automatically (Vercel Clean URL Fix)
    function highlightActiveLink() {
        let path = window.location.pathname;
        
        // If it's the root domain, default to index
        if (path === "/" || path === "") {
            path = "index.html";
        }
        
        const navLinks = document.querySelectorAll('.nav-links a');
        navLinks.forEach(link => {
            let href = link.getAttribute('href');
            
            // Strip .html and leading slashes from both to compare them reliably
            let cleanPath = path.replace('.html', '').replace(/^\//, ''); 
            let cleanHref = href.replace('.html', '');
            
            // Add the active class, but ignore the "Book Now" button
            if (cleanPath === cleanHref && !link.classList.contains('btn')) {
                link.classList.add('active');
            }
        });
    }
    highlightActiveLink();
</script>
</body>
</html>
