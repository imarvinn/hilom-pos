<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HILOM KDS - Kitchen Display</title>
    <link rel="manifest" href="kitchen-manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #1a1a1a; color: white; padding: 20px; overflow-y: auto; height: 100vh; }
        .kitchen-title { font-size: 28px; color: #55efc4; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .live-indicator { font-size: 14px; background: #557a46; color: white; padding: 5px 12px; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="toast">Message goes here</div>

    <div class="kitchen-title">
        <span>🍳 HILOM Kitchen Queue (Live)</span>
        <span class="live-indicator">● Connected to Live Orders</span>
    </div>

    <!-- Kitchen Grid Container -->
    <div id="kitchenBoard" class="kds-grid">
        <p style="color: #666; font-size: 18px;">Waiting for active orders...</p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <!-- Project Scripts -->
    <script src="firebase-init.js"></script>
    <script src="pos-billing.js"></script>
    <script>
        // Safely wait for the DOM to load before initializing listeners
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof loadActiveTables === "function") {
                loadActiveTables();
            } else {
                console.error("loadActiveTables function not found in pos-billing.js");
            }
        });
        if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Kitchen Service Worker Registered'))
      .catch((error) => console.log('Kitchen Service Worker Failed:', error));
  }
    </script>
</body>
</html>
